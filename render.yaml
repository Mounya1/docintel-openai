databases:
  - name: docintel-db
    plan: free
    databaseName: docintel
    user: docintel

services:
  - type: web
    name: docintel-api
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: docintel-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: S3_BUCKET_NAME
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: FRONTEND_URL
        value: https://docintel-frontend-h454.onrender.com
    healthCheckPath: /api/health

  - type: web
    name: docintel-frontend
    runtime: static
    rootDir: frontend
    buildCommand: VITE_API_BASE_URL=https://docintel-api-wnb5.onrender.com npm ci && VITE_API_BASE_URL=https://docintel-api-wnb5.onrender.com npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://docintel-api-wnb5.onrender.com

databases:
  - name: docintel-db
    plan: free
    databaseName: docintel
    user: docintel

services:
  # ── API Backend ──────────────────────────────
  - type: web
    name: docintel-api
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: docintel-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: S3_BUCKET_NAME
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: FRONTEND_URL
        value: https://docintel-frontend.onrender.com
    healthCheckPath: /api/health

  # ── Frontend (Static Site) ───────────────────
  - type: web
    name: docintel-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://docintel-api.onrender.com
